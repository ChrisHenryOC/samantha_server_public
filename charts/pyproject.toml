[project]
name = "samantha-charts"
version = "0.1.0"
# Aligned with the resolved uv.lock target. samantha_server itself
# requires `>=3.12`; widening this range would require regenerating the
# lockfile against an older interpreter and re-running the test suite.
# When that's needed, run `uv lock --upgrade --python 3.12` from this
# directory and update this line.
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "httpx>=0.27",
]

[project.scripts]
samantha-charts-render = "samantha_charts.render:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samantha_charts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=3.0.0.260204",
]
