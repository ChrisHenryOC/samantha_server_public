rule_id: ACC-007
step: ACCESSIONING
applies_at: null
event_type: order_received
severity: PROCEED
priority: null
when:
  equals:
    field: billing_info_present
    value: false
action:
  transition: MISSING_INFO_PROCEED
  # MISSING_INFO_PROCEED is set as a flag (not just a transition target) so downstream
  # resulting rules can detect that billing info was still unresolved at accessioning.
  #
  # Intra-tier resolution with ACC-010/ACC-011: when ACC-010 or ACC-011
  # (REVIEW_HOLD) co-fires with ACC-007 (PROCEED), the REVIEW_HOLD rule wins the
  # transition. However, the engine unions ACC-007's MISSING_INFO_PROCEED flag into
  # flags_added so it is not permanently lost. Review resolution goes
  # PENDING_LLM_REVIEW -> ACCEPTED directly without re-running accessioning, so
  # without the union the billing flag would be silently dropped.
  set_flags:
    - MISSING_INFO_PROCEED
  clear_flags: []
  outcome: proceeding_missing_billing
  panel: null
  branch: null
source: knowledge_base/sops/accessioning.md#3.1
